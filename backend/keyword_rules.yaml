# keyword_rules.yaml
#
# Per-card keyword rules for transaction classification.
# Each card lists categories with keyword lists. Keywords are matched
# case-insensitively against the transaction description (substring match).
# Rules are evaluated top-to-bottom; the FIRST matching category wins.
# If nothing matches, the classifier falls back to sentence-transformers
# semantic similarity, then to the card's `default_category`.

