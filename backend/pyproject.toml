[project]
name = "chime-backend"
version = "0.1.0"
description = "FastAPI Backend for Chime Cashback Tracker"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "python-multipart>=0.0.6",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "pdfplumber>=0.10.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "sentence-transformers>=2.2.0",
    "scikit-learn>=1.3.0",
    "pyinstaller>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
