cards:
  - id: "sbi-cashback"
    name: "SBI Cashback Card"
    bank: "SBI"
    color: "#0072BC"
    icon: "💳"
    # Based on SBI Cashback Card T&C
    # 5% on online spends (any merchant online), 1% on offline, exclusions apply
    categories:
      - name: "Online Spends"
        rate: 5.0
        cap: 5000  # ₹/month max cashback cap on 5% category
      - name: "Offline Spends"
        rate: 1.0
        cap: null
      - name: "Excluded"
        rate: 0.0
        cap: null
    exclusions:
      # No cashback on these
      - "Fuel"
      - "Utilities"
      - "Rent"
      - "Insurance"
      - "EMI"
      - "Wallet Load"
      - "Government Fees"
      - "Jewelry"

  - id: "axis-airtel"
    name: "Airtel Axis Credit Card"
    bank: "Axis Bank"
    color: "#E20000"
    icon: "💳"
    # Based on Airtel Axis Bank Credit Card T&C
    categories:
      - name: "Airtel Services"
        rate: 25.0
        cap: 250  # ₹250/month on Airtel recharges and bills
      - name: "Food & Grocery"
        rate: 10.0
        cap: 500  # Swiggy, Zomato, BigBasket, Blinkit
      - name: "Utilities"
        rate: 10.0
        cap: 300  # Electricity, Water, Gas, DTH
      - name: "Other"
        rate: 1.0
        cap: null  # Everything else (unlimited)
      - name: "Excluded"
        rate: 0.0
        cap: null
    exclusions:
      - "Fuel"
      - "Rent"
      - "Insurance"
      - "EMI"
      - "Wallet Load"
      - "Government Fees"
      - "Cash Advance"
      - "Jewelry"

  - id: "hdfc-swiggy"
    name: "Swiggy HDFC Credit Card"
    bank: "HDFC Bank"
    color: "#FC8019"
    icon: "💳"
    # Based on Swiggy HDFC Bank Credit Card T&C
    categories:
      - name: "Swiggy"
        rate: 10.0
        cap: null  # No stated cap — Swiggy transactions (Food, Instamart, Dineout)
      - name: "Online Food Delivery"
        rate: 10.0
        cap: null  # Covers other food delivery platforms
      - name: "Dining"
        rate: 10.0
        cap: null  # Dining at restaurants (offline POS)
      - name: "Online Spends"
        rate: 5.0
        cap: null  # All other online/e-commerce
      - name: "Other"
        rate: 1.0
        cap: null  # All offline non-dining spends
      - name: "Excluded"
        rate: 0.0
        cap: null
    exclusions:
      - "Fuel"
      - "Rent"
      - "Insurance"
      - "EMI"
      - "Wallet Load"
      - "Government Fees"
      - "Cash Advance"
      - "Utilities"
